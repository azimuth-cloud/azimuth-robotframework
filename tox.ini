[tox]
minversion = 4.0.0
# We run autofix last, to ensure CI fails,
# even though we do our best to autofix locally
envlist = lint,3.10,3.12,codespell,autofix,coverage
#TODO: fix mypy, and re-add it to envlist
skipsdist = True

[testenv]
runner = uv-venv-lock-runner
setenv =
  PYTHONWARNINGS=default::DeprecationWarning
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=60
  COVERAGE_FILE={tox_root}/.coverage.{env_name}
commands = pytest --cov=Azimuth --cov-report= {posargs}

[testenv:autofix]
commands =
    ruff format {tox_root}/Azimuth
    codespell {tox_root}/Azimuth -w
    ruff check {tox_root}/Azimuth --fix

[testenv:codespell]
commands = codespell {tox_root}/Azimuth {posargs}

[testenv:lint]
description = Run Ruff checks
commands =
    ruff check {tox_root}/Azimuth
    ruff format {tox_root}/Azimuth --check

[testenv:coverage]
depends = 3.*
setenv =
    COVERAGE_FILE={tox_root}/.coverage
commands =
    coverage combine
    coverage report
    coverage html -d cover
    coverage xml -o {tox_root}/coverage.xml
    # Mark uncovered lines on the PR's diff
    diff-cover {tox_root}/coverage.xml --compare-branch {env:DIFF_COVER_COMPARE_BRANCH:origin/main} --format markdown:{tox_root}/diff-cover.md,github-annotations:warning


[testenv:mypy]
commands = mypy {tox_root} {posargs}
