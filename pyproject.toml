[project]
name = "azimuth-robotframework"
dynamic = ["version"]
requires-python = ">=3.10"
maintainers = [
    {name = "Azimuth Cloud"}
]
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "azimuth-sdk>=0.2.0",
    "easysemver>=0.2.0",
    "httpx>=0.28.1",
    "jsonschema-default>=1.8.1",
    "openstacksdk>=4.13.0",
    "robotframework>=7.5.1",
    "robotframework-pythonlibcore>=4.6.0",
    "selenium>=4.52.0",
]

[project.urls]
Repository = "https://github.com/azimuth-cloud/azimuth-robotframework"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "coverage>=7.16.2",
    "diff-cover>=10.6.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "tox>=4.65.0",
    "tox-uv>=1.36.1",
    "types-pyyaml>=6.0.12.20261113",
    "types-setuptools>=84.2.0.20261104",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.hatch.build.targets.sdist]
packages = ["Azimuth"]

[tool.hatch.build.targets.wheel]
packages = ["Azimuth"]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true

# These dependencies ship without type hints or stubs
[[tool.mypy.overrides]]
module = ["azimuth_sdk.*", "robotlibcore"]
ignore_missing_imports = true

# Modules that do not pass mypy yet go here.
# Remove entries once they pass.
[[tool.mypy.overrides]]
module = [
    "Azimuth.cluster_types",
    "Azimuth.kubernetes_app_templates",
    "Azimuth.kubernetes_cluster_templates",
    "Azimuth.kubernetes_clusters",
    "Azimuth.main",
    "Azimuth.openstack_cloud",
    "Azimuth.util",
    "Azimuth.zenith",
]
ignore_errors = true

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 15.
max-complexity = 15

[tool.pytest]
testpaths = ["tests"]
strict = true

[tool.coverage.run]
relative_files = true
